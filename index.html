<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Завдання 4: День тижня</title>
    <link rel="stylesheet" href="index.css">
</head>
<body>
    <div class="card">
        <h2>День тижня</h2>
        <div class="input-field">
            <label for="dayInput">Введіть номер дня (1-7):</label>
            <input type="number" id="dayInput" min="1" max="7" placeholder="Наприклад: 3">
        </div>
        <button id="showDayBtn">Дізнатися назву</button>
        <div class="result-box">
            День: <span id="dayResult">---</span>
        </div>
    </div>
    <script src="index.js"></script>
</body>
</html>
